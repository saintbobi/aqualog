name: aquarium-log

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquarium-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - aquarium-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16.9-alpine
    container_name: aquarium-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - aquarium-data:/var/lib/postgresql/data
    networks:
      - aquarium-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: aquarium-redis
    volumes:
      - redis-data:/data
    networks:
      - aquarium-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1-standalone
    container_name: aquarium-adminer
    profiles:
      - tools
    ports:
      - "8080:8080"
    networks:
      - aquarium-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  aquarium-net:
    driver: bridge

volumes:
  aquarium-data:
  redis-data:
